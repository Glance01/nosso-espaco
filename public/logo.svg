<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
    <filter id="sheetShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Top Highlight -->
  <rect x="36" y="36" width="440" height="220" rx="96" fill="#FFFFFF" opacity="0.08" />

  <!-- Resume Sheet (White Card with Folded Corner) -->
  <g filter="url(#sheetShadow)">
    <!-- Base Paper Sheet with cut top-right corner -->
    <path d="M 124 100 
             L 320 100 
             L 388 168 
             L 388 412 
             A 24 24 0 0 1 364 436 
             L 148 436 
             A 24 24 0 0 1 124 412 
             Z" 
          fill="url(#sheetGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 320 100 
             L 320 152 
             A 16 16 0 0 0 336 168 
             L 388 168 
             Z" 
          fill="url(#foldGrad)" opacity="0.85" />
    <path d="M 320 100 L 320 168 L 388 168 Z" fill="#E2E8F0" />
  </g>

  <!-- CV Header: Candidate Avatar & Info -->
  <!-- Candidate Photo Circle -->
  <circle cx="178" cy="166" r="30" fill="#2563EB" />
  <!-- Candidate Silhouette: Head -->
  <circle cx="178" cy="158" r="11" fill="#FFFFFF" />
  <!-- Candidate Silhouette: Shoulders -->
  <path d="M 160 186 A 18 18 0 0 1 196 186 Z" fill="#FFFFFF" />

  <!-- Candidate Name & Title Bars -->
  <rect x="222" y="146" width="90" height="16" rx="8" fill="#0F172A" />
  <rect x="222" y="172" width="70" height="10" rx="5" fill="#3B82F6" />

  <!-- Divider Line -->
  <rect x="156" y="214" width="200" height="4" rx="2" fill="#E2E8F0" />

  <!-- Section: Experiência Profissional -->
  <circle cx="166" cy="242" r="5" fill="#2563EB" />
  <rect x="182" y="238" width="168" height="9" rx="4.5" fill="#334155" />

  <circle cx="166" cy="268" r="5" fill="#2563EB" />
  <rect x="182" y="264" width="144" height="9" rx="4.5" fill="#64748B" />

  <circle cx="166" cy="294" r="5" fill="#2563EB" />
  <rect x="182" y="290" width="124" height="9" rx="4.5" fill="#94A3B8" />

  <!-- Section: Competências (Skill Tags / Pills) -->
  <rect x="156" y="324" width="58" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
  <rect x="166" y="331" width="38" height="6" rx="3" fill="#2563EB" />

  <rect x="222" y="324" width="54" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
  <rect x="232" y="331" width="34" height="6" rx="3" fill="#2563EB" />

  <rect x="284" y="324" width="58" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
  <rect x="294" y="331" width="38" height="6" rx="3" fill="#2563EB" />

  <!-- Section: Linhas de resumo adicionais -->
  <rect x="156" y="364" width="150" height="8" rx="4" fill="#CBD5E1" />
  <rect x="156" y="384" width="110" height="8" rx="4" fill="#E2E8F0" />

  <!-- Verified / Selected Candidate Badge (Bottom Right Accent) -->
  <g filter="url(#badgeShadow)">
    <circle cx="364" cy="386" r="48" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="6" />
    <!-- Crisp Checkmark -->
    <path d="M 346 386 L 358 398 L 384 372" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>